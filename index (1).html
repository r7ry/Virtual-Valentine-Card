<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="index.css" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
        <title>Virtual Anniversary Day Card</title>
    </head>
    <body>
        <div class="envelope-wrapper">
            <div id="envelope" class="close">
                <div class="front flap"></div>
                <div class="front pocket"></div>
                <div class="letter">
                    <p class="words line1">Happy anniversary!!,</p>
                    <p class="words line2"> Miss you so much Sara, you show me so much love and i feel so good with you beside you this feels like our 12th anniversary :p </p>
                    <p class="words line3">Until then your boyfriend and futur husband,</p>
                    <p class="words line4">Love,Ryan</p>
                </div>
                <div class="hearts">
                    <div class="heart a1"></div>
                    <div class="heart a2"></div>
                    <div class="heart a3"></div>
                </div>
            </div>
        </div>
        <div class="reset">
            <button id="open <3">Open</button>
            <button id="Close :( )">Close</button>
        </div>
        <h1 class="valentine">Happy 2nd Anniversary Sara!</h1>
        <script src="index.js"></script>
    </body>
</html>
